name: Nix setup
description: Install Nix and configure the project cache.
inputs:
  cachix-cache:
    required: false
    default: ''
  cachix-auth-token:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      if: inputs.cachix-cache != ''
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}
