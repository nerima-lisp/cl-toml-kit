name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: DeterminateSystems/nix-installer-action@main
        timeout-minutes: 10
      - name: Check flake
        timeout-minutes: 25
        run: nix flake check --keep-going --print-build-logs
      - name: Check diff hygiene
        timeout-minutes: 2
        run: git diff --check
