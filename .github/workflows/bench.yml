name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# Benchmarks need a real runner clock and are diagnostic, not a merge check.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        timeout-minutes: 10
      - name: Run diagnostic benchmarks
        timeout-minutes: 12
        run: timeout 600 nix develop -c sbcl --script run-benchmarks.lisp
