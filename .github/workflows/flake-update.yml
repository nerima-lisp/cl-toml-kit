name: Flake update

on:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        timeout-minutes: 10
      - name: Update lockfile
        timeout-minutes: 5
        run: nix flake update
      - name: Open update pull request
        timeout-minutes: 5
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: 'chore: update flake inputs'
          commit-message: 'chore: update flake inputs'
          branch: automation/flake-update
